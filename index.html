<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a7cff" />
    <link rel="icon" type="image/svg+xml" href="/attendance-app/favicon.svg" />
    <title>员工考勤系统</title>
    <!-- GitHub Pages SPA 回退：404.html 捕获子路由后，在这里恢复原始路径 -->
    <script>
      (function () {
        try {
          var saved = sessionStorage.getItem('spa-redirect');
          if (saved) {
            sessionStorage.removeItem('spa-redirect');
            var target = decodeURIComponent(saved);
            if (location.pathname !== target.split('?')[0].split('#')[0]) {
              history.replaceState(null, '', target);
            }
          }
        } catch (e) {
          /* 隐私模式下 sessionStorage 不可用，忽略即可 */
        }
      })();
    </script>
    <!-- 运行时配置：部署后可直接改 config.js 切换后端地址，无需重新构建 -->
    <script src="/attendance-app/config.js"></script>
    <!-- PWA：主动更新。清掉旧缓存 + SW 更新后立即重载，确保用户永远拿到最新页面 -->
    <script>
      (function () {
        if (!('serviceWorker' in navigator)) return;
        var BASE = '/attendance-app/';
        // 清理历史遗留缓存（含旧版页面），避免缓存的 index.html 引用过期 JS
        function clearOldCaches() {
          if (!('caches' in window)) return Promise.resolve();
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) {
              return caches.delete(k);
            }));
          });
        }
        window.addEventListener('load', function () {
          // 本轮正在由 config.js 清理旧缓存/旧 SW，跳过注册，避免竞态
          try { if (sessionStorage.getItem('attendance_purging') === '1') return; } catch (e) {}
          navigator.serviceWorker.register(BASE + 'sw.js', { scope: BASE })
            .then(function (reg) {
              reg.update();
              // 每次页面加载都清一次旧缓存，保证 HTML/JS 始终取最新
              clearOldCaches();
              // 发现新 SW 安装完成 → 跳过等待并重载页面，让新代码立即生效
              reg.onupdatefound = function () {
                var nw = reg.installing;
                if (!nw) return;
                nw.onstatechange = function () {
                  if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                    if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                    window.location.reload();
                  }
                };
              };
            })
            .catch(function () { /* 注册失败不影响主流程 */ });
          // 控制本页的 SW 发生变更（新版本接管）时自动重载一次
          var reloaded = false;
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (reloaded) return;
            reloaded = true;
            window.location.reload();
          });
        });
      })();
    </script>
    <script type="module" crossorigin src="/attendance-app/assets/index-CFYDsZ2R.js"></script>
    <link rel="stylesheet" crossorigin href="/attendance-app/assets/index-DIe1258r.css">
  <link rel="manifest" href="/attendance-app/manifest.webmanifest"></head>
  <body>
    <div id="root"></div>
  </body>
</html>
